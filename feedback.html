<!doctype html>
<html lang="ru">
<head>
<script src="clarity.js" defer></script>
<script src="transition-boot.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Форма обратной связи — STUDIO 3DAR</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css"><link rel="stylesheet" href="contact.css">
<link rel="stylesheet" href="feedback-transition.css">
<link rel="stylesheet" href="editorial-type.css">
</head>
<body class="subpage no-body-text-fx contact-page feedback-page">
<header class="contact-nav"><a href="contact.html" aria-label="3DAR — вернуться к контактам">3DAR<span>.</span></a></header>
<main data-nogoo><section class="callback" id="callback" aria-labelledby="callback-title">
  <a class="feedback-back" href="contact.html">← Контакты</a>
  <h2 id="callback-title" tabindex="-1">Форма <em>обратной связи</em></h2>
  <form class="callback-form" novalidate data-preview-only="true">
    <div class="name-row"><label>Имя<input name="firstName" autocomplete="given-name" placeholder="Ваше имя" required maxlength="80"></label><label>Фамилия<input name="lastName" autocomplete="family-name" placeholder="Ваша фамилия" maxlength="80"></label></div>
    <label>Телефон<input type="tel" name="phone" autocomplete="tel" placeholder="+7 (…) …" required minlength="7" maxlength="30"></label>
    <label>Email<input type="email" name="email" autocomplete="email" placeholder="Ваш email" maxlength="150"></label>
    <label>Компания<input name="company" autocomplete="organization" placeholder="Название компании" maxlength="160"></label>
    <label>Сообщение<textarea name="message" rows="5" placeholder="Расскажите о вашем проекте" maxlength="4000"></textarea></label>
    <button class="form-submit" type="submit">Отправить сообщение <span aria-hidden="true">↗</span></button>
    <p class="form-status" role="status"></p>
  </form>
</section></main>
<div class="copy-toast" role="status" aria-live="polite" aria-atomic="true"><span class="toast-heading"></span><span class="toast-value"></span></div>
<script src="site.js"></script><script src="contact.js"></script><script src="contact-scroll.js"></script>
</body></html>
